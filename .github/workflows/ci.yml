name: ci

on:
  push:
  pull_request:

jobs:
  compiler-tests:
    name: compiler unit tests (golden byte-compare)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unittest suite
        run: python3 -m unittest discover services/render/tests -v

  worker-tests:
    name: worker validation tests (VAL-1..4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install worker deps
        run: pip install -r services/worker/requirements.txt
      - name: Run validation suite
        run: python3 -m unittest discover services/worker/tests -v

  ui-build:
    name: review UI typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install + build
        run: |
          cd services/ui
          npm ci
          npx tsc --noEmit
          npm run build

  worker-image:
    name: worker image schema routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build worker image
        run: docker build -t ide8-worker -f services/worker/Dockerfile .
      - name: Load each packaged schema, prompt pack and exemplar
        run: docker run --rm --network none ide8-worker python -c 'from schema_registry import load; [load(v) for v in ("0.1", "0.2")]'

  render-image:
    name: render service image + in-container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ide8-render services/render
      - name: Unit tests inside image
        run: docker run --rm ide8-render python3 -m unittest discover tests -v
      - name: Compile + headless export + RND-3 separation acceptance
        run: |
          docker run --rm ide8-render bash -c '
            set -e
            python3 sla_compiler.py examples/example.json /tmp/doc.sla
            xvfb-run -a scribus -g -ns -py service/scribus_scripts/export_pdf.py /tmp/doc.sla /tmp/out.pdf package
            test -s /tmp/out.pdf && echo "export ok: $(stat -c%s /tmp/out.pdf) bytes"
            python3 tests/check_separation.py /tmp/out.pdf CutContour
            grep -aq "/GTS_PDFXVersion (PDF/X-4" /tmp/out.pdf && echo "PDF/X-4 marker ok"
            grep -aq "/OutputIntent" /tmp/out.pdf && echo "output intent ok"
            python3 -c "import json; r = json.load(open(\"/tmp/out.pdf.report.json\")); assert not r.get(\"error\") and r.get(\"overflows\") == [], r; print(\"overflow report clean\")"
          '
