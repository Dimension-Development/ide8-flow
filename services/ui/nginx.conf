server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same contract as the vite dev proxy: strip /api, forward to worker.
    # WORKER_HOST is fixed at "worker" (compose service name).
    location /api/ {
        proxy_pass http://worker:8200/;
        proxy_read_timeout 300s;
        client_max_body_size 32m;
    }
}
